[project]
name = "invictus"
version = "0.1.0"
description = "AI workflow orchestration: versioned DAG workflows, durable LangGraph execution, Redis-backed queues, approvals and crash recovery."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.23"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["invictus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL and Redis (set INVICTUS_TEST_DATABASE_URL / INVICTUS_TEST_REDIS_URL)"]
